# H2 in-memory database for local testing
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.h2.console.enabled=true
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data-h2.sql
spring.jpa.defer-datasource-initialization=true

# Isolated JWT key for local testing
api.security.key=test-h2-jwt-secret-key-for-local-testing

# Redis (necessário para o rate limiting — Bucket4jRateLimiter exige bean RateLimit)
# Porta 6380 = container docker redis-ratelimit (healthy) — 6379 é o redis-cache
# (em crash loop e NÃO é usado pelo profile h2). Alinhado com o remoto 2026-08-04.
coffee.redis.enabled=true
coffee.redis.instances[0].name=rate-limit
coffee.redis.instances[0].host=localhost
coffee.redis.instances[0].port=6380
# Rate limit OFF no dev local enquanto o Redis docker estiver fora do ar
# (RateLimitFilter é fail-closed: Redis down => 500 em TODAS as rotas).
# Espelha o profile test (redis.enabled=true + ratelimit.enabled=false).
# Reativar quando o docker voltar: coffee.ratelimit.enabled=true
coffee.ratelimit.enabled=false
