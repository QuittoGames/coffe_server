spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:test-data.sql

api.security.key=test-api-key-for-jwt-integration-tests

# Cookie (testes rodam em HTTP)
app.cookie.secure=false

# Redis (necessário para o rate limiting — Bucket4jRateLimiter exige bean RateLimit)
# Mantém a exclusão do auto-config do Spring Data Redis; o RedisClientProvider usa Lettuce direto
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,org.springframework.boot.autoconfigure.data.redis.RedisReactiveAutoConfiguration
management.health.redis.enabled=false

coffee.redis.enabled=true
coffee.redis.instances[0].name=rate-limit
coffee.redis.instances[0].host=localhost
coffee.redis.instances[0].port=6379
coffee.ratelimit.enabled=true