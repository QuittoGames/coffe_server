<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Coffee Server</title>
  <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg">
  <meta name="description" content="Acesse o painel do Coffee Server">
  <link rel="stylesheet" href="../styles/main.css">
</head>
<body>
  <main class="login-page">
    <div class="login-container">
      <!-- Brand -->
      <div class="login-brand">
        <img class="login-brand-logo" src="../assets/Logo.png" alt="Coffee Server logo">
        <h1 class="login-brand-title">Coffee <span class="accent">Server</span></h1>
        <p class="login-brand-sub">// controle central do homelab</p>
      </div>

      <!-- Login card -->
      <div class="login-card">
        <h2 class="login-card-title"><span class="terminal-prefix">❯ </span>autenticar</h2>

        <div class="login-error" data-login-error role="alert"></div>

        <form id="login-form" novalidate>
          <div class="input-group">
            <label for="name">Usuário</label>
            <input
              class="input"
              type="text"
              id="name"
              name="name"
              placeholder="quitto"
              autocomplete="username"
              required
              autofocus
            >
          </div>

          <div class="input-group">
            <label for="password">Senha</label>
            <input
              class="input"
              type="password"
              id="password"
              name="password"
              placeholder="••••••••"
              autocomplete="current-password"
              required
            >
          </div>

          <button class="btn btn-primary btn-block" type="submit" style="margin-top: var(--space-2);">
            Entrar
          </button>
        </form>

        <div class="login-divider">ou</div>

        <div class="login-oauth">
          <a class="login-oauth-btn" href="/oauth2/authorization/google">
            <span aria-hidden="true">G</span> Entrar com Google
          </a>
        </div>
      </div>

      <p class="login-footer">
        A sessão é protegida por cookie <code>HttpOnly</code> · <code>v0.0.1</code>
      </p>
    </div>
  </main>

  <script type="module">
    import { protectPage } from '../auth/session.js';
    import { setupLoginForm } from '../auth/login.js';
    import { setupToastListener } from '../components/Toast.js';

    // If already authenticated locally, go straight to the dashboard.
    protectPage({ redirectIfAuthenticated: true });

    setupLoginForm();
    setupToastListener();
  </script>
</body>
</html>
