<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Coffee Server">
  <defs>
    <linearGradient id="cup" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1E40AF"/>
      <stop offset="1" stop-color="#0B0F14"/>
    </linearGradient>
    <linearGradient id="steam" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#E8D5C4" stop-opacity="0"/>
      <stop offset="1" stop-color="#E8D5C4" stop-opacity="0.85"/>
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect x="2" y="2" width="60" height="60" rx="12" fill="#111827" stroke="#1F2937" stroke-width="2"/>

  <!-- Steam wisps -->
  <path d="M20 16 C18 10, 22 8, 20 4" stroke="#E8D5C4" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.6"/>
  <path d="M27 16 C25 10, 29 8, 27 4" stroke="#E8D5C4" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.4"/>

  <!-- Cup body -->
  <path d="M16 22 H42 V40 C42 48, 34 54, 29 54 C24 54, 16 48, 16 40 Z" fill="url(#cup)" stroke="#3B82F6" stroke-width="2"/>

  <!-- Handle -->
  <path d="M42 28 H47 C50 28, 52 31, 52 34 C52 37, 50 40, 47 40 H42" fill="none" stroke="#3B82F6" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Coffee surface -->
  <path d="M19 26 H39 C37 32, 33 34, 29 34 C25 34, 21 32, 19 26 Z" fill="#3C2415"/>
  <rect x="19" y="26" width="20" height="2.5" rx="1.25" fill="#A67B5B"/>

  <!-- Terminal prompt -->
  <text x="29" y="44" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10" fill="#60A5FA">$</text>
  <text x="33" y="44" text-anchor="start" font-family="JetBrains Mono, monospace" font-size="10" fill="#22C55E">_</text>
</svg>
